<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    #hd {
        font-variant: small-caps;
        color: magenta;
    }
    h2 {
        color: white;
        background-color: #cccc00;
    }
    caption{
      text-align: center;
      color:white;
      background-color: orange;
      font-size: 25px;
    }
    h1 {
        color: white;
        background-color: #cccc00;
    }
    body {
        background-color: #ffffcc;
    }
    .center, p {
        text-align: center;
        color: red;
    }
    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }
    th{
        padding: 8px;
        background-color: magenta;
        border-color: green;
        border-width: 2px;
      }

    td{
      background-color: orange;
      border-color: green;
      border-width: 2px;
    }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
    <td rowspan="3" style="background-color: magenta; font-weight: bold ;">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Deca</td>
    <td>Fotbal</td>
    <td>Muzica</td>
  </tr>
  <tr>
    <td rowspan="4" style="background-color: magenta; font-weight: bold;">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Iliescu</td>
    <td>Seriale</td>
    <td>Machiaj</td>
  </tr>
</table>
</body>
</html>
