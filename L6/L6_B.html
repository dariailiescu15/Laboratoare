<!DOCTYPE html>
<html>
<head>
    <title>L6_B</title>
    <script>
        function cereText(id) {
            var text = prompt("Introdu text nou:");
            if (text !== null) {
                document.getElementById(id).innerText = text;
            }
        }

        function inverseaza() {
            var p1 = document.getElementById("p1");
            var p2 = document.getElementById("p2");
            var aux = p1.innerText;
            p1.innerText = p2.innerText;
            p2.innerText = aux;
        }
    </script>
</head>
<body>

    <button onclick="inverseaza()">Schimba textele</button>

    <p id="p1" style="color: blue; font-size: 20px;" onclick="cereText('p1')">Textul initial 1</p>
    <p id="p2" style="color: red; font-style: italic;" onclick="cereText('p2')">Textul initial 2</p>

</body>
</html>
